version: "3.9"

services:
  flask_app:
    build: ./App
    container_name: flask_app
    ports:
      - "5000:5000"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./automation/default_site.tmpl:/etc/nginx/conf.d/default.conf
      - ./automation/ssl:/etc/nginx/ssl
    depends_on:
      - flask_app
    restart: unless-stopped
